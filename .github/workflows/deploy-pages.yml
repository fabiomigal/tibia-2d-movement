name: Publicar demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Construir demonstração estática
        run: pnpm build:github-pages
      - name: Incluir atlas do Batedor de Ruínas
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/fabiomigal/tibia-2d-movement/releases/download/sprites-batedor-ruinas-v1/vale-ambar-batedor-ruinas-v1.zip \
            --output /tmp/vale-ambar-batedor-ruinas-v1.zip
          mkdir -p dist/public/sprites/batedor-ruinas
          unzip -j -o /tmp/vale-ambar-batedor-ruinas-v1.zip \
            'vale-ambar-batedor-ruinas-v1/atlases/*.png' \
            -d dist/public/sprites/batedor-ruinas
          test "$(find dist/public/sprites/batedor-ruinas -maxdepth 1 -name '*.png' | wc -l)" -eq 5
      - name: Incluir sprite do campo uniforme
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/fabiomigal/tibia-2d-movement/releases/download/uniform-field-tile-v1/amber-field-uniform.png \
            --output /tmp/amber-field-uniform.png
          mkdir -p dist/public/field-assets
          cp /tmp/amber-field-uniform.png dist/public/field-assets/amber-field-uniform.png
          test -s dist/public/field-assets/amber-field-uniform.png
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
